name: 缺陷|Bug
description: 当您发现了一个缺陷，需要向社区反馈时，请使用此模板。
title: "[Bug]: "
labels: ["bug"]
type: "缺陷"
body:
  - type: markdown
    attributes:
      value: |
        感谢对HiSpark社区的支持与关注，欢迎反馈缺陷。
  - type: textarea
    attributes:
      label: 发生了什么问题？
      description: 提供尽可能多的信息描述产生了什么问题。
      placeholder: ""
    validations:
      required: true
